# Rebuilds the research site every Monday morning so blog pieces whose publishDate has arrived go live.
# It calls a Cloudflare Pages deploy hook for the research project only. An empty commit would make
# Cloudflare rebuild all six projects, because Pages builds every project on a push with no file changes.
# The hook URL is stored as the repository secret CF_DEPLOY_HOOK_RESEARCH.
# It only calls the hook when a piece is due this week or scheduled later (publishDate on or after
# six days ago, not a draft), so nothing runs when nothing is waiting.
# Run it by hand from the Actions tab with "Run workflow".
# Until the hook is set, the job says so instead of failing every Monday.
name: Research weekly rebuild

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call the research deploy hook if a piece is due
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_RESEARCH }}
        run: |
          cutoff=$(date -u -d "6 days ago" +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || grep -L "^draft: true" apps/research/src/content/blog/*.md | xargs -r grep -h "^publishDate:" | awk -v c="$cutoff" '$2 >= c' | grep -q .; then
            if [ -z "$HOOK" ]; then
              echo "CF_DEPLOY_HOOK_RESEARCH is not set yet, so nothing was rebuilt."
              exit 0
            fi
            curl --fail --silent --show-error -X POST "$HOOK"
          else
            echo "No piece is due; nothing to rebuild."
          fi
